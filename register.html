<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join CampusNest</title><link rel="stylesheet" href="css/styles.css"></head><body><header class="site-header"><nav class="container nav"><a class="logo" href="index.html">Campus<span>Nest</span></a><a href="login.html">Log in</a></nav></header><main class="auth-page"><form class="auth-box" id="auth-form" data-mode="register"><div class="eyebrow">Join the nest</div><h1>Create account</h1><div class="role-toggle"><button type="button" class="active" data-role="student">Student</button><button type="button" data-role="landlord">Landlord</button><button type="button" data-role="agent">Agent</button></div><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Phone</label><input type="tel" name="phone"></div><div class="field"><label>University</label><input name="university"></div><div class="field"><label>Password</label><input type="password" name="password" minlength="6" required></div><button class="btn" type="submit">Create account</button></form></main><script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/app.js"></script><script src="js/auth-pages.js"></script></body></html>
