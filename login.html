<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — CampusNest</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <a href="index.html" class="brand" style="color:#fff"><span class="brand-mark">CN</span>CampusNest</a>
    <div>
      <p class="auth-quote">"I found a verified self-contain near DELSU in two days — no wahala, no fake agent."</p>
      <p class="auth-quote-by">— A student, Abraka</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-box">
      <a href="index.html" class="brand"><span class="brand-mark">CN</span>CampusNest</a>
      <h1>Welcome back</h1>
      <p>Log in to message agents, save favorites and manage your listings.</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="********">
        </div>
        <div class="form-error" id="login-error"></div>
        <button type="submit" class="btn btn-primary btn-block auth-submit" id="login-submit">Log in</button>
      </form>

      <p class="auth-switch">New to CampusNest? <a href="register.html">Create an account</a></p>
    </div>
  </div>
</div>

<script>
  window.CAMPUSNEST_SUPABASE_URL = 'https://fdwrlyxwpktzkatgdyng.supabase.co';
  window.CAMPUSNEST_SUPABASE_ANON_KEY = 'sb_publishable_vLRcflayz_QrPg20nABw0Q_N_QwoM29';
</script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit');
    errorEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const supabase = await window.campusNestSupabaseReady;
      if (!supabase) throw new Error('Could not connect to the account system. Please try again shortly.');

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        if (error.message.toLowerCase().includes('confirm')) {
          throw new Error('Please confirm your email first - check your inbox for the link we sent.');
        }
        throw new Error('Incorrect email or password.');
      }

      const { data: profile } = await supabase.from('profiles').select('*').eq('id', data.user.id).single();

      Auth.login({
        token: data.session.access_token,
        role: profile ? profile.role : 'student',
        user: profile || { email },
      });

      const dest = profile && profile.role === 'admin' ? 'dashboard-admin.html'
        : (profile && (profile.role === 'landlord' || profile.role === 'agent')) ? 'dashboard-landlord.html'
        : 'dashboard-student.html';
      window.location.href = dest;
    } catch (err) {
      errorEl.textContent = err.message || 'Something went wrong. Please try again.';
      errorEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
