<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map — CampusNest</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  #map-canvas{ width: 100%; height: calc(100dvh - 68px); }
  .locate-btn{
    position: absolute; z-index: 500; bottom: 24px; right: 16px;
    width: 52px; height: 52px; border-radius: 50%; background: var(--navy);
    color: #fff; border: none; box-shadow: var(--shadow-navy); font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .locate-btn:active{ transform: scale(0.95); }
  .map-wrap{ position: relative; }
  .map-note{
    position: absolute; top: 16px; left: 16px; right: 16px; z-index: 500;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 10px 14px; font-size: 13px; color: var(--ink-soft); box-shadow: var(--shadow-md);
    max-width: 340px;
  }
  .you-dot{
    width: 18px; height: 18px; border-radius: 50%; background: #1a73e8;
    border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(26,115,232,0.4), 0 2px 6px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark">CN</span>CampusNest</a>
    <ul class="nav-links">
      <li><a href="browse.html">Find housing</a></li>
      <li><a href="map.html">Map</a></li>
      <li><a href="dashboard-landlord.html">List a property</a></li>
      <li data-auth="guest"><a href="login.html">Log in</a></li>
      <li data-auth="user"><a href="dashboard-student.html">My dashboard</a></li>
      <li data-auth="user"><a href="#" data-action="logout">Log out</a></li>
    </ul>
    <div class="nav-actions">
      <a href="register.html" class="btn btn-primary btn-sm" data-auth="guest">Register</a>
      <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<div class="map-wrap">
  <div class="map-note" id="map-note">Tap the blue button to show your current location on the map.</div>
  <div id="map-canvas"></div>
  <button class="locate-btn" id="locate-btn" aria-label="Find my location">📍</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  const map = L.map('map-canvas', { zoomControl: true }).setView([5.68, 5.94], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  const campusIcon = L.divIcon({
    className: '',
    html: '<div style="background:#1E3A8A;color:#fff;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,0.3);"><span style="transform:rotate(45deg);font-size:15px;">🎓</span></div>',
    iconSize: [34, 34],
    iconAnchor: [17, 34],
  });

  L.marker([5.7803, 6.1039], { icon: campusIcon }).addTo(map)
    .bindPopup('<strong>DELSU Abraka</strong><br>Delta State University');

  L.marker([5.5804, 5.7794], { icon: campusIcon }).addTo(map)
    .bindPopup('<strong>FUPRE</strong><br>Federal Univ. of Petroleum Resources, Effurun');

  const youIcon = L.divIcon({ className: '', html: '<div class="you-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
  let youMarker = null;
  let accuracyCircle = null;

  document.getElementById('locate-btn').addEventListener('click', () => {
    const note = document.getElementById('map-note');
    if (!navigator.geolocation) {
      note.textContent = 'Your browser doesn\'t support location. Try a different browser.';
      return;
    }
    note.textContent = 'Finding your location…';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        if (youMarker) map.removeLayer(youMarker);
        if (accuracyCircle) map.removeLayer(accuracyCircle);

        youMarker = L.marker([latitude, longitude], { icon: youIcon }).addTo(map)
          .bindPopup('You are here').openPopup();
        accuracyCircle = L.circle([latitude, longitude], { radius: accuracy, color: '#1a73e8', fillOpacity: 0.1, weight: 1 }).addTo(map);
        map.setView([latitude, longitude], 15);
        note.textContent = 'Showing your current location. Blue pins are DELSU Abraka and FUPRE.';
      },
      (err) => {
        note.textContent = err.code === 1
          ? 'Location permission denied — enable it in your browser settings to use this.'
          : 'Could not get your location. Try again outdoors or with better signal.';
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
</script>
</body>
</html>
