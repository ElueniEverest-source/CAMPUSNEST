<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My dashboard — CampusNest</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="dash-shell">
  <aside class="dash-sidebar">
    <a href="index.html" class="brand"><span class="brand-mark">CN</span>CampusNest</a>
    <nav class="dash-nav">
      <a href="dashboard-student.html" class="active"><span class="nav-icon">♥</span>Favorites</a>
      <a href="browse.html"><span class="nav-icon">🔍</span>Browse homes</a>
      <a href="profile.html"><span class="nav-icon">👤</span>Profile</a>
      <a href="#" data-action="logout"><span class="nav-icon">↪</span>Log out</a>
    </nav>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <button class="dash-mobile-toggle icon-btn">☰</button>
        <h1>Welcome back, <span data-user-name>Student</span></h1>
      </div>
      <a href="browse.html" class="btn btn-primary">Search homes</a>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Your saved homes</h3></div>
      <div style="padding: var(--space-5);">
        <div class="property-grid" id="fav-grid">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/property-card.js"></script>
<script src="js/app.js"></script>
<script>
  (async function () {
    const grid = document.getElementById('fav-grid');
    const favIds = JSON.parse(localStorage.getItem('cn_favorites') || '[]');
    const { data: all } = await CampusNestAPI.getProperties();
    const favProps = all.filter(p => favIds.includes(p.id));
    if (!favProps.length) {
      grid.innerHTML = emptyStateHTML({
        title: 'No favorites yet',
        body: 'Tap the heart on any listing while browsing to save it here for later.',
        showReset: false,
      }).replace('Clear filters', '');
      grid.querySelector('.empty-state').innerHTML += '<a href="browse.html" class="btn btn-primary" style="margin-top:16px;">Browse homes</a>';
    } else {
      renderPropertyGrid(grid, favProps);
    }
  })();
</script>
</body>
</html>
