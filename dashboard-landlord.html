<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landlord dashboard — CampusNest</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="dash-shell">
  <aside class="dash-sidebar">
    <a href="index.html" class="brand"><span class="brand-mark">CN</span>CampusNest</a>
    <nav class="dash-nav">
      <a href="dashboard-landlord.html" class="active"><span class="nav-icon">🏘️</span>My listings</a>
      <a href="#add" id="nav-add-listing"><span class="nav-icon">＋</span>Add property</a>
      <a href="#profile"><span class="nav-icon">👤</span>Profile</a>
      <a href="#" data-action="logout"><span class="nav-icon">↪</span>Log out</a>
    </nav>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <button class="dash-mobile-toggle icon-btn">☰</button>
        <h1>Your listings</h1>
      </div>
      <button class="btn btn-primary" id="open-add-form">＋ Add property</button>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="label">Total listings</div><div class="value" id="stat-total">—</div></div>
      <div class="stat-card"><div class="label">Verified</div><div class="value" id="stat-verified">—</div></div>
      <div class="stat-card"><div class="label">Pending review</div><div class="value" id="stat-pending">—</div></div>
      <div class="stat-card"><div class="label">Total views</div><div class="value" id="stat-views">312</div></div>
    </div>

    <div class="panel" id="add-form-panel" style="display:none; margin-bottom: var(--space-6);">
      <div class="panel-head"><h3>Add a new property</h3><button class="icon-btn" id="close-add-form">✕</button></div>
      <form id="add-form" style="padding: var(--space-5); display:grid; grid-template-columns:1fr 1fr; gap: var(--space-4);">
        <div class="form-group" style="margin-top:0; grid-column: 1/-1;">
          <label for="p-title">Property title</label>
          <input type="text" id="p-title" required placeholder="e.g. Self-contain near DELSU back gate">
        </div>
        <div class="form-group" style="margin-top:0;">
          <label for="p-campus">Campus</label>
          <select id="p-campus" required>
            <option value="DELSU Abraka">DELSU Abraka</option>
            <option value="FUPRE">FUPRE</option>
          </select>
        </div>
        <div class="form-group" style="margin-top:0;">
          <label for="p-type">Property type</label>
          <select id="p-type" required>
            <option>Self-contain</option>
            <option>Room & Parlour</option>
            <option>Mini Flat</option>
            <option>Flat</option>
            <option>Shared</option>
          </select>
        </div>
        <div class="form-group" style="margin-top:0;">
          <label for="p-price">Price per year (₦)</label>
          <input type="number" id="p-price" required placeholder="200000">
        </div>
        <div class="form-group" style="margin-top:0;">
          <label for="p-bedrooms">Bedrooms</label>
          <input type="number" id="p-bedrooms" required min="1" value="1">
        </div>
        <div class="form-group" style="margin-top:0; grid-column:1/-1;">
          <label for="p-area">Area / landmark</label>
          <input type="text" id="p-area" required placeholder="e.g. Abraka, behind Faculty of Science">
        </div>
        <div class="form-group" style="margin-top:0; grid-column:1/-1;">
          <label for="p-amenities">Amenities (comma separated)</label>
          <input type="text" id="p-amenities" placeholder="Prepaid meter, Water, Tiled floor, Security">
        </div>
        <div class="form-group" style="margin-top:0; grid-column:1/-1;">
          <label for="p-photos">Photos</label>
          <input type="file" id="p-photos" accept="image/*" multiple>
          <p class="form-hint">Listings are reviewed before they appear publicly.</p>
        </div>
        <div style="grid-column:1/-1; display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary">Submit for review</button>
          <button type="button" class="btn btn-ghost" id="cancel-add-form">Cancel</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>All properties</h3></div>
      <div style="overflow-x:auto;">
        <table class="data-table" id="listings-table">
          <thead>
            <tr><th>Property</th><th>Type</th><th>Price</th><th>Status</th><th>Views</th><th></th></tr>
          </thead>
          <tbody id="listings-tbody">
            <tr><td colspan="6" style="text-align:center; color:var(--muted); padding:30px;">Loading your listings…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard-landlord.js"></script>
</body>
</html>
