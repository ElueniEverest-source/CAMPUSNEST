<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property dashboard | CampusNest</title><link rel="stylesheet" href="css/styles.css"></head><body><header class="site-header"><nav class="container nav"><a class="logo" href="index.html">Campus<span>Nest</span></a><div class="nav-links"><a href="browse.html">Find a home</a><span data-auth-nav></span></div></nav></header><main class="container dashboard"><div class="eyebrow">Property workspace</div><h1>Manage your homes.</h1><section class="form-panel"><h2 id="property-form-title">Add a property</h2><form id="add-property"><input type="hidden" name="id"><div class="filter-row"><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Price</label><input name="price" type="number" min="1" required></div><div class="field"><label>Price period</label><select name="price_period"><option value="year">Per year</option><option value="month">Per month</option><option value="week">Per week</option></select></div></div><div class="filter-row"><div class="field"><label>University</label><input name="university" required></div><div class="field"><label>Location</label><input name="location" required></div><div class="field"><label>Area</label><input name="area" required></div></div><div class="filter-row"><div class="field"><label>Property type</label><select name="property_type"><option>Self-contained</option><option>Single room</option><option>Room and parlour</option><option>Shared apartment</option><option>Flat</option><option>Hostel</option></select></div><div class="field"><label>Bedrooms</label><input name="bedrooms" type="number" min="0" value="1" required></div><div class="field"><label>Bathrooms</label><input name="bathrooms" type="number" min="0" value="1" required></div></div><div class="filter-row"><div class="field"><label>Amenities</label><input name="amenities" placeholder="Water, security, Wi-Fi"></div><div class="field"><label>Availability</label><select name="availability"><option value="available">Available</option><option value="unavailable">Unavailable</option></select></div></div><div class="field"><label>Description</label><textarea name="description" rows="4"></textarea></div><div class="field"><label>Photos</label><input id="property-images" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="image-preview" class="grid"></div></div><button class="btn" type="submit" id="property-submit">Submit for verification</button><button class="btn ghost" type="button" id="property-cancel" hidden>Cancel edit</button></form></section><section class="section"><h2>My listings</h2><div class="table-wrap"><table class="table"><thead><tr><th>Property</th><th>Price</th><th>Location</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody id="listing-rows"></tbody></table></div></section></main><script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/app.js"></script><script>Auth.whenReady().then(()=>{if(!Auth.isLoggedIn()||!(Auth.isLandlord()||Auth.isAgent()))location.href='login.html';});</script><script src="js/dashboard-landlord.js"></script></body></html>
