<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse homes | CampusNest</title><link rel="stylesheet" href="css/styles.css"></head><body><header class="site-header"><nav class="container nav"><a class="logo" href="index.html">Campus<span>Nest</span></a><div class="nav-links"><a href="browse.html">Find a home</a><span data-auth-nav></span></div></nav></header><main class="container"><div class="page-title"><div class="eyebrow">Browse verified homes</div><h1>Make your next move.</h1></div><div class="browse-layout"><form class="filters" id="filters"><div class="field"><label>Search</label><input name="search" placeholder="Title, area or keyword"></div><div class="field"><label>University</label><input name="university" placeholder="Any university"></div><div class="field"><label>Location</label><input name="location" placeholder="Any location"></div><div class="field"><label>Type</label><select name="propertyType"><option value="">Any type</option><option>Self-contained</option><option>Single room</option><option>Room and parlour</option><option>Shared apartment</option><option>Flat</option><option>Hostel</option></select></div><div class="filter-row"><div class="field"><label>Bedrooms</label><input type="number" min="0" name="bedrooms"></div><div class="field"><label>Availability</label><select name="availability"><option value="">Any</option><option value="available">Available</option><option value="unavailable">Unavailable</option></select></div></div><div class="field"><label>Price preset</label><select id="price-preset"><option value="">Any price</option><option value="0-200000">Under ₦200,000</option><option value="200000-300000">₦200,000–₦300,000</option><option value="300000-500000">₦300,000–₦500,000</option><option value="500000-1000000">₦500,000–₦1,000,000</option><option value="1000000-">₦1,000,000+</option></select></div><div class="filter-row"><div class="field"><label>
