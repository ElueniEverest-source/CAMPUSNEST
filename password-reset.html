<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | CampusNest</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="container nav">
      <a class="logo" href="index.html">Campus<span>Nest</span></a>
      <div data-auth-nav></div>
    </nav>
  </header>

  <main class="container">
    <section class="auth-box" id="reset-section" style="margin: 3rem auto; max-width: 500px;">
      <h1>Reset Password</h1>

      <!-- Step 1: Request Reset -->
      <form id="request-form">
        <div class="eyebrow">Step 1 of 2</div>
        <p class="muted">Enter your email address and we'll send you a password reset link.</p>
        
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>

        <div id="request-error" style="display: none; margin-bottom: 1rem; padding: 0.75rem; background: #fee2e2; color: #991b1b; border-radius: 6px;"></div>

        <button class="btn" type="submit">Send Reset Link</button>
        <a href="login.html" style="display: block; text-align: center; margin-top: 1rem; color: #10b981; text-decoration: none;">Back to login</a>
      </form>

      <!-- Step 2: Reset Password -->
      <form id="reset-form" style="display: none;">
        <div class="eyebrow">Step 2 of 2</div>
        <p class="muted">Enter your reset token and new password.</p>
        
        <div class="field">
          <label>New password</label>
          <input type="password" name="password" minlength="6" required>
        </div>

        <div class="field">
          <label>Confirm Password</label>
          <input type="password" name="password-confirm" minlength="6" required>
        </div>

        <div id="reset-error" style="display: none; margin-bottom: 1rem; padding: 0.75rem; background: #fee2e2; color: #991b1b; border-radius: 6px;"></div>

        <button class="btn" type="submit">Reset Password</button>
        <button class="btn" type="button" id="back-btn" style="background: #f3f4f6; color: #1e3a8a;">Back</button>
      </form>

      <!-- Success Message -->
      <div id="success-msg" style="display: none; text-align: center; padding: 2rem;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">✓</div>
        <h2>Password Reset Successful</h2>
        <p class="muted">Your password has been updated. You can now log in with your new password.</p>
        <a href="login.html" class="btn">Go to Login</a>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/password-reset.js"></script>
</body>
</html>
