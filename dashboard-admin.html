<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin dashboard — CampusNest</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="dash-shell">
  <aside class="dash-sidebar">
    <a href="index.html" class="brand"><span class="brand-mark">CN</span>CampusNest</a>
    <nav class="dash-nav">
      <a href="#" id="tab-approvals" class="active"><span class="nav-icon">🛡️</span>Approvals</a>
      <a href="#" id="tab-users"><span class="nav-icon">👥</span>Users</a>
      <a href="#" data-action="logout"><span class="nav-icon">↪</span>Log out</a>
    </nav>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <button class="dash-mobile-toggle icon-btn">☰</button>
        <h1 id="page-title">Listing approvals</h1>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="label">Pending review</div><div class="value" id="stat-pending">—</div></div>
      <div class="stat-card"><div class="label">Verified live</div><div class="value" id="stat-approved">—</div></div>
      <div class="stat-card"><div class="label">Rejected</div><div class="value" id="stat-rejected">—</div></div>
      <div class="stat-card"><div class="label">Landlords & agents</div><div class="value" id="stat-agents">—</div></div>
    </div>

    <div class="panel" id="panel-approvals">
      <div class="panel-head"><h3>Awaiting your review</h3></div>
      <div style="overflow-x:auto;">
        <table class="data-table">
          <thead><tr><th>Property</th><th>Agent</th><th>University</th><th>Price</th><th>Submitted</th><th></th></tr></thead>
          <tbody id="pending-tbody">
            <tr><td colspan="6" style="text-align:center; color:var(--muted); padding:30px;">Loading pending listings…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel" id="panel-users" style="display:none;">
      <div class="panel-head"><h3>All registered users</h3></div>
      <div style="overflow-x:auto;">
        <table class="data-table">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>University</th><th>Joined</th></tr></thead>
          <tbody id="users-tbody">
            <tr><td colspan="5" style="text-align:center; color:var(--muted); padding:30px;">Loading users…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  const API_BASE = 'https://campusnest-7q59.onrender.com';
</script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard-admin.js"></script>
</body>
</html>
